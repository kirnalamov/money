services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=MoneyApp

      # Database
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app

      # Security - IMPORTANT: Change SECRET_KEY in production!
      - SECRET_KEY=dev-secret-key-CHANGE-IN-PRODUCTION-use-openssl-rand-hex-32
      - BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]

      # Logging
      - LOG_FORMAT=console
      - LOG_LEVEL=INFO
      # Optional: Initial superuser (uncomment to create on first run)
      # - FIRST_SUPERUSER_EMAIL=admin@example.com
      # - FIRST_SUPERUSER_USERNAME=admin
      # - FIRST_SUPERUSER_PASSWORD=SecurePassword123!
      # - FIRST_SUPERUSER_FULL_NAME=Admin User
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
