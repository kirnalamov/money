<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Новая операция — прототип v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
:root{--bg:#070806;--surface:#0f110d;--group:#161913;--hover:#1e2218;--text:#f1f4ea;--muted:#8f9588;--accent:#c6f24e;--on-accent:#10160a;--tone:#ff6f6a;--line:rgba(200,240,90,.09);--display:"Unbounded","Onest","Segoe UI",system-ui,sans-serif;--body:"Onest","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 var(--body)}
body{display:flex;justify-content:center;padding:24px 12px}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.modal{width:100%;max-width:440px;background:radial-gradient(90% 45% at 0% 0%,rgba(198,242,78,.07),transparent 70%),var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.pad{padding:24px 24px 8px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font:600 17px var(--display);letter-spacing:-.02em;margin:0}
.x{background:var(--group);border:0;width:34px;height:34px;border-radius:50%;color:var(--muted);display:grid;place-items:center;transition:.15s}
.x:hover{background:var(--hover);color:var(--text)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--group);border-radius:14px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--hover);border-radius:10px;transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.seg button{position:relative;background:none;border:0;padding:10px 0;font:500 14px var(--body);color:var(--muted);transition:color .2s}
.seg button[aria-selected=true]{color:var(--tone)}
.amount{text-align:center;padding:40px 0 30px}
.amt{display:flex;justify-content:center;align-items:baseline;color:var(--tone);font:600 56px/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums;transition:color .2s}
.amt input{background:none;border:0;outline:0;font:inherit;letter-spacing:inherit;color:inherit;width:1ch;padding:0}
.amt input::placeholder{color:#262c20}
.amt .s{opacity:.55;font-size:.6em;margin-right:.1em}
.amt button.s{background:none;border:0;font-size:.6em;color:inherit;padding:0 .1em;border-radius:8px;transition:.15s}
.amt button.s:hover{opacity:1;background:var(--group)}
.note{margin-top:14px;font-size:13px;color:var(--muted);min-height:19px}
.note.bad{color:#ff6f6a}
.group{background:var(--group);border-radius:18px;margin-bottom:24px}
.row{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;min-height:54px}
.row+.row{border-top:1px solid var(--line)}
.row .k{color:var(--muted)}
.row .v{display:flex;align-items:center;gap:6px;font-weight:500}
.row select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.row.err .v{color:#ff6f6a}
.pill{background:none;border:0;border-radius:99px;padding:5px 11px;font:500 14px var(--body);color:var(--muted);transition:.15s}
.pill[aria-pressed=true]{background:var(--hover);color:var(--text)}
.lbl{font-size:13px;color:var(--muted);margin:0 0 10px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{background:var(--group);border:1px solid transparent;border-radius:99px;padding:9px 16px;font:500 14px var(--body);transition:.15s}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:none;border-color:var(--tone);color:var(--tone)}
.chips.sm{margin-top:-10px}
.chips.sm .chip{font-size:13px;padding:7px 13px;color:var(--muted)}
.chips.sm .chip[aria-pressed=true]{color:var(--tone)}
.chips.fade{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.link{background:none;border:0;color:var(--muted);font:500 14px var(--body);padding:0 2px 4px;margin-bottom:18px}
.link:hover{color:var(--text)}
.more{display:none;margin-bottom:20px}
.more.open{display:block}
.in{width:100%;background:var(--group);border:1px solid transparent;border-radius:14px;padding:13px 16px;font:400 15px var(--body);outline:0;margin-bottom:10px}
.in:focus{border-color:rgba(255,255,255,.18)}
.in::placeholder{color:#58615a}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:var(--group);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.tag button{background:none;border:0;color:var(--muted);padding:0 4px;font-size:15px}
.tags input{background:none;border:0;outline:0;font:400 13px var(--body);width:110px;padding:6px 4px}
.tags input::placeholder{color:#58615a}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px}
.opt small{display:block;color:var(--muted);font-size:12px}
.sw{width:44px;height:26px;border-radius:99px;background:#262c20;border:0;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd5ca;transition:.2s}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{left:21px;background:var(--on-accent)}
.foot{display:flex;align-items:center;gap:8px;padding:16px 24px 24px;background:linear-gradient(to top,var(--surface) 70%,transparent)}
.cancel{background:none;border:0;color:var(--muted);font:500 15px var(--body);padding:14px 16px;border-radius:14px}
.cancel:hover{color:var(--text)}
.save{flex:1;background:var(--accent);color:var(--on-accent);border:0;border-radius:16px;padding:15px;font:600 15px var(--body);transition:.2s}
.save.off{background:var(--group);color:#5b645c}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.done{display:none;text-align:center;padding:80px 24px}
.done .ok{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 18px;font-size:26px}
.done p{color:var(--muted);margin:8px 0 0}
.done .link{color:var(--accent);margin:18px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.amt{font-size:46px}}
</style>
</head>
<body>
<div class="modal">
<div id="form">
 <div class="pad">
  <div class="head"><h1>Новая операция</h1><button class="x" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="seg" id="tabs" role="tablist"><i id="thumb"></i>
   <button role="tab" data-t="expense" aria-selected="true">Расход</button>
   <button role="tab" data-t="income" aria-selected="false">Доход</button>
   <button role="tab" data-t="transfer" aria-selected="false">Перевод</button>
  </div>
  <div class="amount">
   <div class="amt"><span class="s" id="sign">−</span><button class="s" id="sym" title="Сменить валюту" aria-label="Сменить валюту">$</button><input id="amt" inputmode="decimal" placeholder="0" autofocus aria-label="Сумма"></div>
   <div class="note" id="note"></div>
  </div>
  <div class="group">
   <div class="row" id="accRow"><span class="k">Счёт</span><span class="v"><span id="accVal">Выберите</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="M6 9l6 6 6-6"/></svg></span>
    <select id="acc" aria-label="Счёт"><option value="">Выберите</option><option data-b="1713">Основной счёт</option><option data-b="-16">Наличные</option><option data-b="10804">Инвестиции</option><option data-b="3566">Накопления</option></select></div>
   <div class="row"><span class="k">Дата</span><span class="v" id="dates"><button class="pill" data-d="0" aria-pressed="true"></button><button class="pill" data-d="1" aria-pressed="false">Вчера</button></span></div>
  </div>

  <p class="lbl" id="catLbl">Категория</p>
  <div class="chips" id="cats"></div>
  <div class="chips sm fade" id="subs" style="display:none"></div>

  <button class="link" id="moreBtn">＋ Описание и метки</button>
  <div class="more" id="more">
   <input class="in" placeholder="Описание, например: покупка в магазине">
   <div class="tags" id="tags"></div>
  </div>

  <div class="opt"><div>Повторять каждый месяц<small id="recS" style="display:none">В этот же день</small></div><button class="sw" role="switch" aria-checked="false" id="swRec" aria-label="Повторять каждый месяц"></button></div>
  <div class="opt" id="tgMan"><div>Обязательный расход</div><button class="sw" role="switch" aria-checked="false" id="swMan" aria-label="Обязательный расход"></button></div>
 </div>
 <div class="foot"><button class="cancel">Отмена</button><button class="save off" id="save">Сохранить</button></div>
</div>
<div class="done" id="done"><div class="ok">✓</div><h1>Операция сохранена</h1><p id="dmsg"></p><button class="link" id="again">Добавить ещё</button></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var C={expense:{"Продукты":["Супермаркет","Рынок","Доставка"],"Транспорт":["Такси","Метро","Авиа","Аренда авто"],"Кафе":["Кофе","Обед","Ужин"],"Жильё":["Аренда","Коммуналка","Ремонт"],"Покупки":["Одежда","Техника","Подарки"],"Здоровье":["Аптека","Врач","Спорт"]},
income:{"Зарплата":[],"Подработка":[],"Проценты":[],"Подарок":[]},transfer:{"Накопления":[],"Инвестиции":[],"Наличные":[]}};
var TONE={expense:"#ff6f6a",income:"#c6f24e",transfer:"#5aa9f0"},SIGN={expense:"−",income:"+",transfer:""},IDX={expense:0,income:1,transfer:2};
var CUR=["$","€","₽"],ci=0,T="expense",cat=null,sub=null,off=0,tags=["еда","дом"];
function chip(n,p,k){return '<button class="chip" aria-pressed="'+p+'" data-'+k+'="'+n+'">'+n+'</button>'}
function rCats(){var h="";Object.keys(C[T]).forEach(function(n){h+=chip(n,n===cat,"c")});$("cats").innerHTML=h;$("catLbl").textContent=T==="transfer"?"Куда переводим":"Категория";var s=cat?C[T][cat]:[];$("subs").style.display=s.length?"flex":"none";var g="";s.forEach(function(n){g+=chip(n,n===sub,"s")});$("subs").innerHTML=g}
function rTags(){var h="";tags.forEach(function(t,i){h+='<span class="tag">'+t+'<button data-x="'+i+'" aria-label="Удалить метку">×</button></span>'});h+='<input id="tagIn" placeholder="+ метка">';$("tags").innerHTML=h;$("tagIn").onkeydown=function(e){if(e.key==="Enter"&&this.value.trim()){tags.push(this.value.trim());rTags();$("tagIn").focus()}}}
function num(){return parseFloat(($("amt").value||"").replace(",","."))||0}
function size(){$("amt").style.width=Math.max(($("amt").value||"0").length,1)+"ch"}
function note(){var o=$("acc").selectedOptions[0];$("accVal").textContent=o.value?o.text:"Выберите";var n=$("note");if(!o.dataset.b){n.textContent="";n.className="note";return}var b=+o.dataset.b,bad=T==="expense"&&num()>b;n.textContent=bad?"Не хватает "+(num()-b).toLocaleString("ru-RU")+" "+CUR[ci]:"Доступно "+b.toLocaleString("ru-RU")+" "+CUR[ci];n.className="note"+(bad?" bad":"")}
function ok(){var k=num()>0&&$("acc").value&&cat;$("save").classList.toggle("off",!k);return !!k}
function date(){var d=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+", "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});document.querySelector("#dates [data-d='0']").textContent="Сегодня, "+d.split(", ")[1]}
function setT(t){T=t;cat=null;sub=null;document.documentElement.style.setProperty("--tone",TONE[t]);document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===t)});$("thumb").style.transform="translateX("+IDX[t]*100+"%)";$("sign").textContent=SIGN[t];$("tgMan").style.display=t==="expense"?"flex":"none";rCats();note();ok()}
$("tabs").onclick=function(e){if(e.target.dataset.t)setT(e.target.dataset.t)};
$("cats").onclick=function(e){var b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;sub=null;rCats();ok()}};
$("subs").onclick=function(e){var b=e.target.closest("[data-s]");if(b){sub=sub===b.dataset.s?null:b.dataset.s;var s=$("subs");rCats()}};
$("tags").onclick=function(e){if(e.target.dataset.x!==undefined){tags.splice(+e.target.dataset.x,1);rTags()}};
$("amt").oninput=function(){size();note();ok()};
$("acc").onchange=function(){$("accRow").classList.remove("err");note();ok()};
$("sym").onclick=function(){ci=(ci+1)%3;this.textContent=CUR[ci];note()};
$("dates").onclick=function(e){var d=e.target.dataset.d;if(d===undefined)return;off=+d;document.querySelectorAll("#dates .pill").forEach(function(b){b.setAttribute("aria-pressed",b===e.target)})};
$("moreBtn").onclick=function(){var o=$("more").classList.toggle("open");this.textContent=o?"− Скрыть":"＋ Описание и метки"};
function tog(id,fn){$(id).onclick=function(){var on=this.getAttribute("aria-checked")!=="true";this.setAttribute("aria-checked",on);if(fn)fn(on)}}
tog("swRec",function(on){$("recS").style.display=on?"block":"none"});tog("swMan");
function save(){if(!ok()){if(!$("acc").value)$("accRow").classList.add("err");return}$("form").style.display="none";$("done").style.display="block";$("dmsg").textContent=SIGN[T]+CUR[ci]+$("amt").value+" · "+cat+(sub?" / "+sub:"")+" · "+$("accVal").textContent}
$("save").onclick=save;
$("again").onclick=function(){$("done").style.display="none";$("form").style.display="block";$("amt").value="";$("acc").value="";size();setT(T);$("amt").focus()};
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="amt")save()});
rTags();setT("expense");date();size();
</script>
</body>
</html>
